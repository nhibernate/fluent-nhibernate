name: Prepare Release

on:
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  IGNORE_NORMALISATION_GIT_HEAD_MOVE: 1

permissions:
  contents: write      # create the draft release
  issues: read         # read milestone issues for the notes
  pull-requests: read  # include merged PRs in the notes

jobs:
  prepare:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json
    - name: Restore dependencies
      run: dotnet tool restore
    - name: Create release notes
      run: dotnet cake --target Release-Notes --verbosity Diagnostic
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
